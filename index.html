<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog</title>

    <style>
        /* =========================================================
           GLOBAL
        ========================================================= */

        :root {
            --bg: #f5f5f3;
            --surface: #ffffff;
            --surface-soft: #f1f1ef;

            --text: #181818;
            --text-soft: #6d6d6d;

            --border: #e2e2df;
            --accent: #111111;

            --radius: 18px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            overflow-y: scroll;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: var(--bg);
            color: var(--text);

            padding-bottom: 160px;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .site-header {
            padding: 70px 24px 25px;
            text-align: center;
        }

        .site-label {
            display: inline-block;

            margin-bottom: 15px;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;

            color: var(--text-soft);

            text-transform: uppercase;
        }

        h1 {
            margin: 0;

            font-size: clamp(42px, 7vw, 72px);
            font-weight: 700;

            letter-spacing: -3px;
            line-height: 1;

            color: var(--text);
        }

        .site-description {
            max-width: 500px;

            margin: 18px auto 0;

            font-size: 16px;
            line-height: 1.7;

            color: var(--text-soft);
        }


        /* =========================================================
           MAIN WRAPPER
        ========================================================= */

        .page-container {
            width: calc(100% - 40px);
            max-width: 900px;

            margin: 0 auto;
        }


        /* =========================================================
           WEATHER
        ========================================================= */

        #weatherSection {
            position: relative;

            margin: 25px auto 20px;

            padding: 24px;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            box-shadow: var(--shadow);

            overflow: hidden;
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            gap: 20px;

            margin-bottom: 5px;
        }

        .weather-title {
            margin: 0;

            font-size: 14px;
            font-weight: 700;

            letter-spacing: 0.5px;
        }

        .weather-description {
            margin: 5px 0 0;

            font-size: 13px;
            color: var(--text-soft);
        }

        .weather-status {
            display: flex;
            align-items: center;

            gap: 7px;

            font-size: 12px;
            color: var(--text-soft);

            white-space: nowrap;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #20b15a;
        }

        canvas {
            display: block;

            width: 100%;
            height: 200px;

            margin-top: 20px;
        }

        #graphTime {
            margin-top: 15px;

            padding-top: 14px;

            border-top: 1px solid var(--border);

            font-size: 12px;
            color: var(--text-soft);
        }


        /* =========================================================
           CREATE AREA
        ========================================================= */

        .create-row {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 32px 0 15px;
        }

        .section-title {
            margin: 0;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 1.5px;

            text-transform: uppercase;
            color: var(--text-soft);
        }


        /* ADD BUTTON */

        #addBtn {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding-bottom: 4px;

            border-radius: 50%;

            background: var(--accent);
            color: white;

            font-size: 34px;
            font-weight: 300;
            line-height: 1;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;

            user-select: none;

            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.16);
        }

        #addBtn:hover {
            transform: rotate(90deg) scale(1.06);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
        }

        #addBtn.clicked {
            transform: rotate(45deg);
        }


        /* =========================================================
           EDITOR
        ========================================================= */

        #editor {
            display: none;

            margin: 0 auto 30px;
            padding: 28px;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            box-shadow: var(--shadow);
        }

        #editor h3 {
            margin: 0 0 22px;

            font-size: 24px;
            letter-spacing: -0.5px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            display: block;

            margin-bottom: 7px;

            font-size: 12px;
            font-weight: 700;

            color: var(--text-soft);

            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input,
        textarea {
            width: 100%;

            margin: 0;
            padding: 13px 14px;

            font: inherit;
            font-size: 15px;

            background: #fafafa;
            color: var(--text);

            border: 1px solid var(--border);
            border-radius: 10px;

            outline: none;

            resize: vertical;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        textarea {
            min-height: 120px;
        }

        input:focus,
        textarea:focus {
            background: white;

            border-color: #999;

            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            margin-top: 5px;
            padding: 12px 22px;

            background: var(--accent);
            color: white;

            border: none;
            border-radius: 10px;

            cursor: pointer;

            font-size: 14px;
            font-weight: 600;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        button:hover {
            background: #333;

            transform: translateY(-1px);

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.16);
        }

        button:active {
            transform: translateY(0);
        }


        /* =========================================================
           BLOG
        ========================================================= */

        #blogContainer {
            width: 100%;

            display: flex;
            flex-direction: column;

            gap: 22px;
        }

        .blog-post {
            position: relative;

            padding: 32px;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            box-shadow: var(--shadow);

            overflow: hidden;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .blog-post:hover {
            transform: translateY(-2px);

            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.08);
        }

        .post-title {
            margin: 0 0 28px;

            text-align: left;

            color: var(--text);

            font-size: clamp(28px, 5vw, 40px);
            font-weight: 700;

            letter-spacing: -1.5px;
            line-height: 1.1;
        }


        /* MAIN CONTENT + SIDEBAR */

        .post-content {
            display: grid;

            grid-template-columns: 15fr 5fr;

            gap: 28px;
        }


        /* MAIN CONTENT */

        .main-content {
            min-width: 0;
            text-align: left;
        }

        .main-content p {
            margin: 0;

            font-size: 17px;
            line-height: 1.8;

            color: #383838;

            white-space: pre-wrap;
            word-break: break-word;
        }


        /* SIDEBAR */

        .sidebar {
            min-width: 0;

            padding: 18px;

            background: var(--surface-soft);

            border-radius: 12px;

            text-align: left;

            overflow: hidden;

            font-size: 14px;
            line-height: 1.6;

            color: #555;

            box-sizing: border-box;
            word-break: break-word;
        }

        .sidebar img {
            display: block;

            width: 100%;
            max-width: 100%;
            height: auto;

            margin: 12px auto;

            border-radius: 9px;

            object-fit: cover;

            box-sizing: border-box;
        }

        .sidebar img:first-child {
            margin-top: 0;
        }

        .sidebar img:last-child {
            margin-bottom: 0;
        }

        .sidebar img + img {
            margin-top: 15px;
        }


        /* FOOTER */

        .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 28px;
            padding-top: 18px;

            border-top: 1px solid var(--border);
        }

        .footer {
            margin: 0;

            font-size: 12px;
            line-height: 1.5;

            color: var(--text-soft);
        }


        /* =========================================================
           EMPTY STATE
        ========================================================= */

        #emptyState {
            padding: 60px 25px;

            text-align: center;

            border: 1px dashed #c9c9c6;
            border-radius: var(--radius);

            color: var(--text-soft);
        }

        .empty-icon {
            margin-bottom: 12px;

            font-size: 30px;
        }

        #emptyState p {
            margin: 0;

            font-size: 14px;
            line-height: 1.6;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 700px) {

            .site-header {
                padding-top: 50px;
            }

            .page-container {
                width: calc(100% - 28px);
            }

            h1 {
                letter-spacing: -2px;
            }

            #weatherSection {
                padding: 20px;
            }

            .weather-header {
                flex-direction: column;
                gap: 10px;
            }

            canvas {
                height: 170px;
            }

            #editor {
                padding: 22px;
            }

            .blog-post {
                padding: 24px;
            }

            .post-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .sidebar {
                width: 100%;
            }

            .post-title {
                margin-bottom: 22px;
            }

            .post-meta {
                flex-direction: column;
                align-items: flex-start;
            }
        }

    </style>
</head>


<body>

    <!-- =========================================================
         HEADER
    ========================================================== -->

    <header class="site-header">

        <span class="site-label">
            Personal Journal
        </span>

        <h1>
            My Blog
        </h1>

        <p class="site-description">
            Thoughts, stories and moments from everyday life.
        </p>

    </header>


    <main class="page-container">


        <!-- =========================================================
             WEATHER
        ========================================================== -->

        <section id="weatherSection">

            <div class="weather-header">

                <div>
                    <p class="weather-title">
                        Local Weather
                    </p>

                    <p class="weather-description">
                        Temperature forecast for the next 24 hours
                    </p>
                </div>

                <div class="weather-status">
                    <span class="status-dot"></span>
                    Live
                </div>

            </div>

            <canvas id="weatherGraph"></canvas>

            <div id="graphTime">
                Loading time...
            </div>

        </section>


        <!-- =========================================================
             CREATE BLOG
        ========================================================== -->

        <div class="create-row">

            <p class="section-title">
                Latest Posts
            </p>

            <div
                id="addBtn"
                title="Create a new blog post"
                aria-label="Create blog post"
            >
                +
            </div>

        </div>


        <!-- =========================================================
             EDITOR
        ========================================================== -->

        <section id="editor">

            <h3>
                Create a Blog Post
            </h3>


            <div class="input-group">

                <label class="input-label" for="titleInput">
                    Title
                </label>

                <input
                    id="titleInput"
                    placeholder="Give your post a title"
                >

            </div>


            <div class="input-group">

                <label class="input-label" for="mainInput">
                    Main Content
                </label>

                <textarea
                    id="mainInput"
                    placeholder="Write something..."
                    rows="5"
                ></textarea>

            </div>


            <div class="input-group">

                <label class="input-label" for="sidebarInput">
                    Sidebar
                </label>

                <textarea
                    id="sidebarInput"
                    placeholder="Sidebar content or image HTML..."
                    rows="3"
                ></textarea>

            </div>


            <div class="input-group">

                <label class="input-label" for="footerInput">
                    Footer
                </label>

                <input
                    id="footerInput"
                    placeholder="Footer text"
                >

            </div>


            <button onclick="submitBlog()">
                Publish Post
            </button>

        </section>


        <!-- =========================================================
             BLOG POSTS
        ========================================================== -->

        <div id="blogContainer">

            <div id="emptyState">

                <div class="empty-icon">
                    ✦
                </div>

                <p>
                    No posts yet.<br>
                    Click + to write your first story.
                </p>

            </div>

        </div>


    </main>


    <script>

        /* =========================================================
           WEATHER GRAPH
        ========================================================== */

        function drawMainWeatherGraph() {

            navigator.geolocation.getCurrentPosition(

                pos => {

                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;


                    fetch(
                        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m`
                    )

                    .then(res => res.json())

                    .then(data => {

                        const temps =
                            data.hourly.temperature_2m.slice(0, 24);


                        const canvas =
                            document.getElementById("weatherGraph");

                        const ctx =
                            canvas.getContext("2d");


                        /*
                           Higher resolution canvas
                           keeps the graph sharp.
                        */

                        const width = 800;
                        const height = 200;

                        canvas.width = width;
                        canvas.height = height;


                        ctx.clearRect(
                            0,
                            0,
                            width,
                            height
                        );


                        /*
                           Calculate min/max so the graph
                           always fits inside the canvas.
                        */

                        const minTemp =
                            Math.min(...temps);

                        const maxTemp =
                            Math.max(...temps);

                        const range =
                            maxTemp - minTemp || 1;


                        const paddingTop = 25;
                        const paddingBottom = 25;


                        /* subtle horizontal guide lines */

                        ctx.strokeStyle = "#ececea";
                        ctx.lineWidth = 1;

                        for (let i = 1; i <= 3; i++) {

                            const y =
                                (height / 4) * i;

                            ctx.beginPath();

                            ctx.moveTo(0, y);

                            ctx.lineTo(width, y);

                            ctx.stroke();
                        }


                        /* temperature graph */

                        ctx.beginPath();

                        ctx.strokeStyle = "#181818";
                        ctx.lineWidth = 2.5;

                        ctx.lineJoin = "round";
                        ctx.lineCap = "round";


                        temps.forEach((t, i) => {

                            const x =
                                (i / (temps.length - 1))
                                * width;

                            const normalized =
                                (t - minTemp) / range;

                            const y =
                                height
                                - paddingBottom
                                - normalized
                                * (
                                    height
                                    - paddingTop
                                    - paddingBottom
                                );


                            if (i === 0) {

                                ctx.moveTo(x, y);

                            } else {

                                ctx.lineTo(x, y);

                            }

                        });


                        ctx.stroke();


                        document.getElementById(
                            "graphTime"
                        ).innerText =
                            "Updated " +
                            new Date().toLocaleString();

                    });

                },

                () => {

                    document.getElementById(
                        "graphTime"
                    ).innerText =
                        "Location permission is required to display local weather.";

                }

            );

        }


        drawMainWeatherGraph();



        /* =========================================================
           EDITOR TOGGLE
        ========================================================== */

        document
            .getElementById("addBtn")
            .addEventListener(
                "click",
                function () {

                    this.classList.toggle("clicked");


                    const editor =
                        document.getElementById(
                            "editor"
                        );


                    if (
                        editor.style.display ===
                        "block"
                    ) {

                        editor.style.display =
                            "none";

                    }

                    else {

                        document.getElementById(
                            "titleInput"
                        ).value = "";

                        document.getElementById(
                            "mainInput"
                        ).value = "";

                        document.getElementById(
                            "sidebarInput"
                        ).value = "";

                        document.getElementById(
                            "footerInput"
                        ).value = "";


                        editor.style.display =
                            "block";


                        /*
                           Automatically scroll editor
                           into view.
                        */

                        editor.scrollIntoView({
                            behavior: "smooth",
                            block: "nearest"
                        });

                    }

                }
            );



        /* =========================================================
           SUBMIT BLOG
        ========================================================== */

        function submitBlog() {

            const title =
                document.getElementById(
                    "titleInput"
                ).value;

            const main =
                document.getElementById(
                    "mainInput"
                ).value;

            const sidebar =
                document.getElementById(
                    "sidebarInput"
                ).value;

            const footer =
                document.getElementById(
                    "footerInput"
                ).value;


            createBlog(
                title,
                main,
                sidebar,
                footer
            );


            document.getElementById(
                "editor"
            ).style.display =
                "none";


            document.getElementById(
                "addBtn"
            ).classList.remove(
                "clicked"
            );

        }



        /* =========================================================
           CREATE BLOG
        ========================================================== */

        function createBlog(
            title,
            main,
            sidebar,
            footer
        ) {

            const container =
                document.getElementById(
                    "blogContainer"
                );


            /*
               Remove empty state after
               first post is created.
            */

            const emptyState =
                document.getElementById(
                    "emptyState"
                );

            if (emptyState) {
                emptyState.remove();
            }


            const post =
                document.createElement("article");


            post.className =
                "blog-post";


            const date =
                new Date().toLocaleString();


            post.innerHTML = `

                <h2 class="post-title">
                    ${title}
                </h2>

                <div class="post-content">

                    <div class="main-content">
                        <p>${main}</p>
                    </div>

                    <aside class="sidebar">
                        ${sidebar}
                    </aside>

                </div>

                <div class="post-meta">

                    <div class="footer">
                        ${footer}
                    </div>

                    <div class="footer">
                        Posted on: ${date}
                    </div>

                </div>

            `;


            container.appendChild(post);

        }

    </script>

</body>
</html>
