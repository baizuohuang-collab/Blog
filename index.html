<!DOCTYPE html>
<html>
<head>
    <title>My Blog</title>

    <style>
        body {
            overflow-y: scroll;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            padding-bottom: 200px;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
            font-size: 40px;
            color: black;
        }

        #weatherSection {
            max-width: 800px;
            margin: 20px auto;
            background: #eef;
            padding: 15px;
            border: 1px solid #99c;
        }

        canvas {
            width: 100%;
            height: 200px;
            margin-top: 10px;
        }

        #addBtn {
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: inline-block;
            margin-left: 20px;
        }

        #addBtn:hover {
            transform: rotate(90deg);
        }

        #addBtn.clicked {
            transform: rotate(45deg);
        }

        #editor {
            margin: 20px auto;
            padding: 15px;
            border: 1px solid #ccc;
            max-width: 800px;
            display: none;
            background: #fff;
        }

        input, textarea {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
        }

button {
    margin-top: 15px;
    padding: 10px 20px;

    background-color: black;
    color: white;

    border: none;
    border-radius: 4px;

    cursor: pointer;

    font-size: 16px;
}

button:hover {
    background-color: #333;
}

        #blogContainer {
            width: 100%;
            max-width: 800px;
            margin: auto;
        }

        .blog-post {
    border: 1px solid #04f1f9;
    padding: 20px;
    margin: 20px 0;
    background: white;
}

/* Title */
.post-title {
    text-align: center;
    color: black;
    font-size: 30px;
    margin: 0 0 20px 0;
}

/* Main content + sidebar */
.post-content {
    display: grid;

    /* 15 : 5 = 3 : 1 */
    grid-template-columns: 15fr 5fr;

    gap: 20px;
}

/* Main content */
.main-content {
    text-align: left;
}

.main-content p {
    margin: 0;
    font-size: 18px;
    line-height: 1.6;
    color: #333;
}

/* Sidebar */
/* Protect sidebar layout from images */
.sidebar {
    background-color: #f0f0f0;
    padding: 15px;
    text-align: left;

    /* Prevent content from escaping the sidebar */
    overflow: hidden;

    /* Allow long text/images to shrink */
    min-width: 0;
    box-sizing: border-box;
}

/* All images inside the sidebar */
.sidebar img {
    display: block;

    /* Never become wider than the sidebar */
    max-width: 100%;

    /* Keep the original proportions */
    height: auto;

    /* Prevent image from overflowing */
    box-sizing: border-box;

    /* Put some space between pictures */
    margin: 10px auto;
}

/* If there are multiple images */
.sidebar img + img {
    margin-top: 15px;
}

/* Footer */
.footer {
    margin-top: 15px;
    font-size: 13px;
    color: gray;
}
    </style>
</head>

<body>

    <!-- ⭐ MAIN TITLE -->
    <h1>My Blog</h1>

    <!-- ⭐ WEATHER GRAPH + TIME UNDER TITLE -->
    <div id="weatherSection">
        <canvas id="weatherGraph"></canvas>
        <div id="graphTime">Loading time...</div>
    </div>

    <!-- ⭐ ADD BUTTON -->
    <div id="addBtn">+</div>

    <!-- ⭐ BLOG EDITOR -->
    <div id="editor">
        <h3>Create a Blog Post</h3>

        <input id="titleInput" placeholder="Blog Title">
        <textarea id="mainInput" placeholder="Main Content" rows="5"></textarea>
        <textarea id="sidebarInput" placeholder="Sidebar Content" rows="3"></textarea>
        <input id="footerInput" placeholder="Footer Text">

        <button onclick="submitBlog()">Create Blog</button>
    </div>

    <!-- ⭐ BLOG POSTS -->
    <div id="blogContainer"></div>

    <script>
        /* ------------------ WEATHER GRAPH UNDER TITLE ------------------ */
        function drawMainWeatherGraph() {
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;

                fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m`)
                    .then(res => res.json())
                    .then(data => {
                        const temps = data.hourly.temperature_2m.slice(0, 24);

                        const canvas = document.getElementById("weatherGraph");
                        const ctx = canvas.getContext("2d");

                        canvas.width = 800;
                        canvas.height = 200;

                        ctx.beginPath();
                        ctx.strokeStyle = "blue";
                        ctx.lineWidth = 2;

                        temps.forEach((t, i) => {
                            const x = (i / 23) * canvas.width;
                            const y = canvas.height - (t * 4);
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        });

                        ctx.stroke();

                        document.getElementById("graphTime").innerText =
                            "Current Time: " + new Date().toLocaleString();
                    });
            });
        }

        drawMainWeatherGraph();


        /* ------------------ BUTTON TOGGLE ------------------ */

        
        document.getElementById("addBtn").addEventListener("click", function () {

    this.classList.toggle("clicked");

    const editor = document.getElementById("editor");

    if (editor.style.display === "block") {

        // Close editor
        editor.style.display = "none";

    } else {

        // Clear all input fields
        document.getElementById("titleInput").value = "";
        document.getElementById("mainInput").value = "";
        document.getElementById("sidebarInput").value = "";
        document.getElementById("footerInput").value = "";

        // Open blank editor
        editor.style.display = "block";
    }
});

        /* ------------------ SUBMIT BLOG ------------------ */
        function submitBlog() {
            const title = document.getElementById("titleInput").value;
            const main = document.getElementById("mainInput").value;
            const sidebar = document.getElementById("sidebarInput").value;
            const footer = document.getElementById("footerInput").value;

            createBlog(title, main, sidebar, footer);

            // Close editor
            document.getElementById("editor").style.display = "none";
            document.getElementById("addBtn").classList.remove("clicked");
        }


        /* ------------------ CREATE BLOG ------------------ */
function createBlog(title, main, sidebar, footer) {
    const container = document.getElementById("blogContainer");

    const post = document.createElement("div");
    post.className = "blog-post";

    const date = new Date().toLocaleString();

    post.innerHTML = `
        <h2 class="post-title">${title}</h2>

        <div class="post-content">
            <div class="main-content">
                <p>${main}</p>
            </div>

            <div class="sidebar">
                ${sidebar}
            </div>
        </div>

        <div class="footer">
            ${footer}
        </div>

        <div class="footer">
            Posted on: ${date}
        </div>
    `;

    container.appendChild(post);
}
    </script>

</body>
</html>
